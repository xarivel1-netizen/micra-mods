name: Regenerate mods manifest

# Rebuilds mods/manifest.json whenever you add or remove a .jar in mods/.
on:
  push:
    paths:
      - "mods/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate manifest
        run: node scripts/gen-manifest.js

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain mods/manifest.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add mods/manifest.json
            git commit -m "chore: regenerate mods manifest"
            git push
          else
            echo "manifest already up to date"
          fi
